version: 2

sources:
  - name: weather
    schema: weather
    loader: airflow
    tags: [raw]

    tables:
      - name: observations
        identifier: observation_hourly
        description: Hourly observed weather per city.
        loaded_at_field: valid_time
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 30, period: hour}

      - name: forecasts
        identifier: forecast_hourly
        description: Hourly forecast snapshots per city (multiple model runs per valid time).
        loaded_at_field: model_run
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 30, period: hour}

      - name: metrics_daily
        identifier: metrics_daily
        description: Daily pre-aggregated metrics produced by the pipeline.
