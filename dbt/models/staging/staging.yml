version: 2

models:
  - name: stg_observations
    description: Hourly observed weather (per city).
    # Model-level tests (attach to the model itself)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city, valid_time]
    columns:
      - name: city
        tests: [not_null]
      - name: valid_time
        tests: [not_null]

  - name: stg_forecasts
    description: Hourly forecasts (per city/model_run).
    columns:
      - name: city
        tests: [not_null]
      - name: model_run
        tests: [not_null]

  - name: stg_cities
    description: Seeded list of supported cities.
    columns:
      - name: city
        tests: [not_null, unique]
