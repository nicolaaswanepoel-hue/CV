version: 2

models:
  - name: stg_observations
    tests:
      - not_null:
          column_name: city
      - not_null:
          column_name: valid_time
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city, valid_time]

  - name: stg_forecasts
    tests:
      - not_null:
          column_name: city
      - not_null:
          column_name: model_run
