weather_lab:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST','postgres') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: "{{ env_var('DBT_PORT','5432') | int }}"
      dbname: "{{ env_var('DBT_DB','weather') }}"
      schema: "{{ env_var('DBT_SCHEMA','analytics') }}"
      threads: "{{ env_var('DBT_THREADS','4') | int }}"
