name: Setup Python Tooling
description: Install Python, cache pip, and install common dev tools for this job
inputs:
  python-version:
    default: "3.11"
  extra-packages:
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: ${{ runner.os }}-pip-${{ inputs.python-version }}-

    - shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff black mypy pytest types-requests ${{ inputs.extra-packages }}
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
