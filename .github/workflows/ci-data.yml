name: CI - Data sanity

on:
  push:
    paths:
      - docs/data/*.csv
      - .github/workflows/ci-data.yml
  pull_request:
    paths:
      - docs/data/*.csv

permissions:
  contents: read

jobs:
  csv-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

