# Reusable workflow to setup Python + tooling
name: _setup-python-tooling
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      extra-packages:
        type: string
        default: ""
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ inputs.python-version }}-

      - name: Install tools & deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black mypy pytest types-requests ${{ inputs.extra-packages }}
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
