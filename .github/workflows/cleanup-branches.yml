name: Housekeeping — Delete merged PR branch
on:
  pull_request:
    types: [closed]
permissions:
  contents: write   # required to delete refs with GITHUB_TOKEN

jobs:
  delete_branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.repo.full_name, github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO:   ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting $BRANCH from $REPO"
          gh api --method DELETE repos/$REPO/git/refs/heads/$BRANCH || echo "Nothing to delete."
