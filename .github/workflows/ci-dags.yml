name: CI - Airflow DAGs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag-checks:
    runs-on: ubuntu-latest

    steps:
      - run: echo "CI - Airflow DAGs starting on ${{ github.ref }} (event=${{ github.event_name }})"

      - uses: actions/checkout@v4

      # Local composite action (no tag for local paths)
      - uses: ./.github/actions/setup-python-tooling
        with:
          python-version: "3.11"

      # Detect DAG directory (supports either dags/ or airflow/dags/)
      - name: Detect DAG directory
        id: detect
        shell: bash
        run: |
          if [ -d "dags" ]; then
            echo "dir=dags" >> "$GITHUB_OUTPUT"
          elif [ -d "airflow/dags" ]; then
            echo "dir=airflow/dags" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: No DAG directory - skip
        if: ${{ steps.detect.outputs.dir == '' }}
        run: echo "No DAG directory found; skipping Airflow DAG checks."

      - name: Set DAG_DIR env
        if: ${{ steps.detect.outputs.dir != '' }}
        run: echo "DAG_DIR=${{ steps.detect.outputs.dir }}" >> "$GITHUB_ENV"

      # ---- Stub imports without heredoc (write to a file, then run) ----
      - name: Stub imports (airflow/pandas/numpy/psycopg2)
        if: ${{ steps.detect.outputs.dir != '' }}
        shell: bash
        run: |
          cat > _stub_imports.py <<'PY'
import sys, types, math
def stub_module(name, attrs=None):
    m = types.ModuleType(name)
    for k, v in (attrs or {}).items():
        setattr(m, k, v)
    sys.modules[name] = m
# airflow tree (minimal)
stub_module("airflow")
stub_module("airflow.models")
stub_module("airflow.operators")
stub_module("airflow.operators.python")
# pandas (basic)
class _DF: pass
def _read_sql(*a, **k): return _DF()
stub_module("pandas", {"DataFrame": _DF, "read_sql": _read_sql, "to_datetime": lambda *a, **k: None})
# numpy (basic)
stub_module("numpy", {"mean": lambda x: 0.0, "sqrt": math.sqrt, "abs": abs})
# psycopg2 (connect shim)
class _Conn:
    autocommit = False
    def cursor(self):
        class C:
            def execute(self, *a, **k): pass
            def fetchone(self): return [None]
            def close(self): pass
        return C()
    def commit(self): pass
    def close(self): pass
def _connect(**kwargs): return _Conn()
stub_module("psycopg2", {"connect": _connect})
print("Stubbed airflow/pandas/numpy/psycopg2 for import checks.")
PY
          python _stub_imports.py

      - name: Ruff (style)
        if: ${{ steps.detect.outputs.dir != '' }}
        run: ruff check "$DAG_DIR"

      - name: Syntax check (py_compile)
        if: ${{ steps.detect.outputs.dir != '' }}
        shell: bash
        run: |
          files=$(git ls-files "$DAG_DIR/**/*.py")
          if [ -z "$files" ]; then
            echo "No DAG .py files - skipping syntax/import checks."
            exit 0
          fi
          python - <<PY
import py_compile, sys
files = """$files""".split()
for f in files:
    py_compile.compile(f, doraise=True)
print("py_compile OK on", len(files), "files")
PY

      - name: Import check (importlib)
        if: ${{ steps.detect.outputs.dir != '' }}
        shell: bash
        run: |
          python - <<'PY'
import importlib, pathlib, os
dag_dir = os.environ["DAG_DIR"]
for p in pathlib.Path(dag_dir).rglob("*.py"):
    mod = p.with_suffix("").as_posix().replace("/", ".")
    print("Importing", mod)
    importlib.import_module(mod)
print("All DAG modules import successfully (with stubs).")
PY

      - name: Mypy (types)
        if: ${{ steps.detect.outputs.dir != '' }}
        run: mypy --ignore-missing-imports "$DAG_DIR"
