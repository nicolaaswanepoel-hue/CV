name: CI - Airflow DAGs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag-checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI - Airflow DAGs starting on ${{ github.ref }} (event=${{ github.event_name }})"

      - uses: actions/checkout@v4

      # If you don't have this local action, replace with actions/setup-python + pip install.
      - uses: ./.github/actions/setup-python-tooling
        with:
          python-version: "3.11"

      # --- Write a robust stub_imports.py so DAGs import without real Airflow/deps ---
      - name: Create stub_imports.py
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from textwrap import dedent

          STUB = dedent('''\
          # stub_imports.py — minimal shims so DAG files import in CI
          import sys, types, math

          def stub_module(name, attrs=None):
              m = types.ModuleType(name)
              if attrs:
                  for k, v in attrs.items():
                      setattr(m, k, v)
              sys.modules[name] = m
              return m

          def stub_package(name, attrs=None):
              m = types.ModuleType(name)
              m.__path__ = []  # mark as package
              if attrs:
                  for k, v in attrs.items():
                      setattr(m, k, v)
              sys.modules[name] = m
              return m

          # -------- Airflow stubs --------
          class _DAG:
              def __init__(self, dag_id, *a, **k): self.dag_id = dag_id
              def __enter__(self): return self
              def __exit__(self, *a): return False

          class _BaseOperator:
              def __init__(self, task_id, *a, **k): self.task_id = task_id
              # allow chaining a >> b >> c
              def __rshift__(self, other): return other
              def __lshift__(self, other): return other

          class _PythonOperator(_BaseOperator):
              def __init__(self, task_id, python_callable=None, *a, **k):
                  super().__init__(task_id, *a, **k)
                  self.python_callable = python_callable

          class _BashOperator(_BaseOperator):
              def __init__(self, task_id, bash_command="", *a, **k):
                  super().__init__(task_id, *a, **k)
                  self.bash_command = bash_command

          airflow_pkg  = stub_package("airflow", {"DAG": _DAG})
          operators_pkg = stub_package("airflow.operators")
          stub_module("airflow.models")
          stub_module("airflow.operators.python", {"PythonOperator": _PythonOperator})
          stub_module("airflow.operators.bash",   {"BashOperator": _BashOperator})

          utils_pkg = stub_package("airflow.utils")
          class _TriggerRule:
              ALL_SUCCESS="all_success"; ALL_FAILED="all_failed"; ALL_DONE="all_done"
              ONE_FAILED="one_failed"; ONE_SUCCESS="one_success"; NONE_FAILED="none_failed"
              NONE_SKIPPED="none_skipped"; NONE_FAILED_OR_SKIPPED="none_failed_or_skipped"; ALWAYS="always"
          stub_module("airflow.utils.trigger_rule", {"TriggerRule": _TriggerRule})

          # -------- light stubs for heavy deps --------
          class _DF:
              def to_csv(self, *a, **k): return ""

          def _read_sql(*a, **k): return _DF()

          stub_module("pandas", {
              "DataFrame": _DF,
              "read_sql": _read_sql,
              "to_datetime": lambda *a, **k: None,
              "isna": lambda x: False,
          })

          stub_module("numpy", {
              "mean": lambda x: 0.0,
              "sqrt": math.sqrt,
              "abs": abs,
              "round": round,
              "array": lambda x, **k: x,
          })

          class _Cursor:
              def execute(self, *a, **k): pass
              def fetchone(self): return [None]
              def close(self): pass

          class _Conn:
              autocommit = False
              def cursor(self): return _Cursor()
              def commit(self): pass
              def close(self): pass

          def _connect(**kwargs): return _Conn()
          stub_module("psycopg2", {"connect": _connect})

          class _Resp:
              def __init__(self, text="", status_code=200):
                  self.text = text; self.status_code = status_code
              def json(self): return {}

          def _get(*a, **k): return _Resp()
          def _post(*a, **k): return _Resp()
          stub_module("requests", {"get": _get, "post": _post, "Response": _Resp})

          class _Point:
              def __init__(self, *a, **k): pass

          class _Hourly:
              def __init__(self, *a, **k): pass
              def fetch(self, *a, **k): return _DF()

          stub_module("meteostat", {"Point": _Point, "Hourly": _Hourly})
          ''')
          with open('stub_imports.py', 'w', encoding='utf-8') as f:
              f.write(STUB)
          print("Wrote stub_imports.py")
          PY

      - name: Create import_check.py
        run: |
          cat > import_check.py <<'PY'
          # Ensure stubs are loaded in THIS process
          import stub_imports  # noqa: F401

          import importlib.util, pathlib, os, sys

          dag_dir = os.environ.get("DAG_DIR")
          if not dag_dir:
              print("DAG_DIR not set", file=sys.stderr)
              sys.exit(1)

          files = sorted(str(p) for p in pathlib.Path(dag_dir).rglob("*.py"))
          if not files:
              print("No DAG .py files - nothing to import.")
              sys.exit(0)

          for idx, path in enumerate(files, start=1):
              mod_name = f"_dagmodule_{idx}"
              print(f"Loading {path} as {mod_name}")
              spec = importlib.util.spec_from_file_location(mod_name, path)
              if spec is None or spec.loader is None:
                  print(f"Failed to create spec for {path}", file=sys.stderr)
                  sys.exit(1)
              mod = importlib.util.module_from_spec(spec)
              sys.modules[mod_name] = mod
              spec.loader.exec_module(mod)

          print("All DAG files imported successfully (via file paths, with stubs).")
          PY

      - name: Create py_compile_check.py
        run: |
          cat > py_compile_check.py <<'PY'
          import py_compile, sys, pathlib, os
          dag_dir = os.environ.get("DAG_DIR")
          if not dag_dir:
              print("DAG_DIR not set", file=sys.stderr); sys.exit(1)
          files = [str(p) for p in pathlib.Path(dag_dir).rglob("*.py")]
          if not files:
              print("No DAG .py files - skipping syntax/import checks.")
              sys.exit(0)
          for f in files:
              py_compile.compile(f, doraise=True)
          print("py_compile OK on", len(files), "files")
          PY

      - name: Run DAG checks
        shell: bash
        run: |
          set -euo pipefail

          # Detect DAG dir
          DAG_DIR=""
          if [ -d "dags" ]; then
            DAG_DIR="dags"
          elif [ -d "airflow/dags" ]; then
            DAG_DIR="airflow/dags"
          fi

          if [ -z "$DAG_DIR" ]; then
            echo "No DAG directory found; skipping Airflow DAG checks."
            exit 0
          fi
          echo "Using DAG_DIR=$DAG_DIR"
          export DAG_DIR

          # Ruff (style) — install if your local action didn't
          if ! command -v ruff >/dev/null 2>&1; then
            pip install ruff
          fi
          ruff check "$DAG_DIR"

          # Syntax check via py_compile
          python py_compile_check.py

          # Import check (stubs are imported inside import_check.py)
          python import_check.py

          # mypy (types) — install if your local action didn't
          if ! command -v mypy >/dev/null 2>&1; then
            pip install mypy
          fi
          mypy --ignore-missing-imports "$DAG_DIR"
