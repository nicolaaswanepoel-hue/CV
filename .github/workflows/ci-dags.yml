name: CI — Airflow DAGs
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  dag-checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI — Airflow DAGs starting on ${{ github.ref }} (event=${{ github.event_name }})"
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-tooling
        with:
          python-version: "3.11"

      - name: Airflow import stubs
        run: |
          python - <<'PY'
import sys, types
stub = types.ModuleType("airflow")
sys.modules["airflow"] = stub
sys.modules["airflow.models"] = types.ModuleType("airflow.models")
sys.modules["airflow.operators"] = types.ModuleType("airflow.operators")
sys.modules["airflow.operators.python"] = types.ModuleType("airflow.operators.python")
print("Stubbed minimal airflow modules for import checks.")
PY

      - name: Ruff (style)
        run: ruff check airflow/dags

      - name: Syntax/import check
        run: |
          python -m py_compile $(git ls-files "airflow/dags/**/*.py")
          python - <<'PY'
import importlib, pathlib
for p in pathlib.Path("airflow/dags").rglob("*.py"):
    mod = p.with_suffix("").as_posix().replace("/", ".")
    print("Importing", mod)
    importlib.import_module(mod)
print("All DAG modules import successfully (with stubs).")
PY

      - name: Mypy (type checks)
        run: mypy --ignore-missing-imports airflow/dags
