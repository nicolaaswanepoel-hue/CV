jobs:
  dag-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-python-tooling.yml
        with:
          python-version: "3.11"
      - name: Airflow import stubs
        run: |
          python - <<'PY'
import sys, types
stub = types.ModuleType("airflow")
sys.modules["airflow"] = stub
sys.modules["airflow.models"] = types.ModuleType("airflow.models")
sys.modules["airflow.operators"] = types.ModuleType("airflow.operators")
sys.modules["airflow.operators.python"] = types.ModuleType("airflow.operators.python")
print("Stubbed minimal airflow modules.")
PY
      - run: ruff check docker/dags
      - run: python -m py_compile $(git ls-files "docker/dags/**/*.py")
      - run: mypy --ignore-missing-imports docker/dags
