name: CI — Docker build
on:
  push:
    paths: ["Dockerfile", "docker/**", ".github/workflows/ci-docker.yml"]
  pull_request:
    paths: ["Dockerfile", "docker/**"]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/test:ci
