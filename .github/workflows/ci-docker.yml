name: CI — Docker build
on:
  push:
    paths: ["docker/**", ".github/workflows/ci-docker.yml"]
  pull_request:
    paths: ["docker/**"]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Airflow image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .                         # repo root
          file: docker/images/airflow.Dockerfile
          tags: local/test:ci
          load: true                         # load into Docker to enable the next step
          cache-from: type=gha
          cache-to: type=gha,mode=max