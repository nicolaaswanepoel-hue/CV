name: CI — Python
on:
  push:
    paths: ["**/*.py", "pyproject.toml", "requirements*.txt", ".github/workflows/ci-python.yml"]
  pull_request:
    paths: ["**/*.py", "pyproject.toml", "requirements*.txt"]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 👇 call your shared setup workflow instead of repeating installs
      - uses: ./.github/workflows/_setup-python-tooling.yml
        with:
          python-version: "3.11"

      - run: ruff check .
      - run: black --check .
      - run: mypy --ignore-missing-imports .
      - run: pytest -q || echo "No tests yet — add some when ready."
