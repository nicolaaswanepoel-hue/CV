name: CI — Python
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI — Python starting on ${{ github.ref }} (event=${{ github.event_name }})"
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python-tooling
        with:
          python-version: "3.11"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: mypy (types, ignore missing imports to start)
        run: mypy --ignore-missing-imports .

      - name: pytest
        run: pytest -q || echo "No tests yet — add some when ready."
