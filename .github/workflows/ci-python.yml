name: CI — Python
on:
  push:
    paths: ["**/*.py", "pyproject.toml", "requirements*.txt", ".github/workflows/ci-python.yml"]
  pull_request:
    paths: ["**/*.py", "pyproject.toml", "requirements*.txt"]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Call the shared setup workflow from THIS repo's main branch
      - uses: nicolaaswanepoel-hue/CV/.github/workflows/_setup-python-tooling.yml@main
        with:
          python-version: "3.11"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: mypy (types, ignore missing imports to start)
        run: mypy --ignore-missing-imports .

      - name: pytest
        run: pytest -q || echo "No tests yet — add some when ready."
